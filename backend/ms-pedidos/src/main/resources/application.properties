spring.application.name=ms-pedidos
server.port=${PORT:8083}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skinmarket?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:skinmarket}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=${MIGRATE:false}
spring.config.import=classpath:shared.properties
springdoc.api-docs.path=/api/v1/pedidos/openapi
springdoc.swagger-ui.path=/api/v1/pedidos/swagger-ui.html
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
