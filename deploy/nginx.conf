server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  location / { try_files $uri $uri/ /index.html; }
  location /api/v1/products { proxy_pass http://ms-productos:8082; }
  location /api/v1/productos/ { proxy_pass http://ms-productos:8082; }
  location /swagger-ui/ { proxy_pass http://ms-usuarios:8081; }
  location ~ ^/api/v1/(cart|orders|inventory|wallet|admin/orders|seller/orders|pedidos)(/|$) { proxy_pass http://ms-pedidos:8083; }
  location /api/v1/ { proxy_pass http://ms-usuarios:8081; }
  location /health { access_log off; return 200 'ok'; }
}
